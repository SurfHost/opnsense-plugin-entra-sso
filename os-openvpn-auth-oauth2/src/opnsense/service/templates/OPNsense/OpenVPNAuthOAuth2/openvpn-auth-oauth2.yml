{#
 # openvpn-auth-oauth2 daemon configuration, rendered by configd.
 # Key names verified against the upstream Configuration wiki (v1.28, Aug 2026).
 # Careful: configd hands EMPTY config.xml elements to jinja as None, not '',
 # so every optional leaf goes through |default('', true) (the boolean makes
 # it also replace None). Free-form values are escaped for double-quoted YAML.
 # Secrets end up in this file. configd chmods rendered files to the parent
 # directory's mode minus the execute bits, so supervisor.py forces the
 # directory to 0700 and this file to 0600 before every daemon start.
 #}
{% macro q(value) %}"{{ value|replace('\\', '\\\\')|replace('"', '\\"') }}"{% endmacro %}
{% if helpers.exists('OPNsense.OpenVPNAuthOAuth2.general.enabled') and OPNsense.OpenVPNAuthOAuth2.general.enabled == '1' %}
{% set cfg = OPNsense.OpenVPNAuthOAuth2 %}
{% set instance_uuid = cfg.general.vpnInstance|default('', true) %}
{% set vpnid = namespace(value='') %}
{% set has_instances = helpers.exists('OPNsense.OpenVPN') and OPNsense.OpenVPN is mapping
       and helpers.exists('OPNsense.OpenVPN.Instances') and OPNsense.OpenVPN.Instances is mapping
       and helpers.exists('OPNsense.OpenVPN.Instances.Instance') %}
{% if has_instances %}
{%   for instance in helpers.toList('OPNsense.OpenVPN.Instances.Instance') %}
{%     if instance['@uuid'] == instance_uuid %}
{%       set vpnid.value = instance.vpnid %}
{%     endif %}
{%   endfor %}
{% endif %}
{% set secret = cfg.http.secret|default('', true) %}
{% set listen_addr = cfg.http.listenAddress|default('', true) %}
{% set issuer = cfg.entra.issuer|default('', true) %}
{% set client_secret = cfg.entra.clientSecret|default('', true) %}
{% set scopes = cfg.entra.scopes|default('', true) %}
{% set groups = cfg.validation.allowedGroups|default('', true) %}
http:
  listen: "{% if ':' in listen_addr %}[{{ listen_addr }}]{% else %}{{ listen_addr }}{% endif %}:{{ cfg.http.listenPort|default('', true) }}"
  baseurl: {{ q(cfg.http.baseUrl|default('', true)) }}
  secret: {{ q(secret) }}
{% if cfg.validation.validateIpAddr|default('', true) == '1' %}
  check:
    ipaddr: true
{% endif %}
{% if cfg.http.tlsEnabled|default('', true) == '1' %}
  tls: true
  # exported from the OPNsense trust store by the supervisor at service start
  cert: /usr/local/etc/openvpn-auth-oauth2/http.crt
  key: /usr/local/etc/openvpn-auth-oauth2/http.key
{% endif %}

oauth2:
{% if issuer != '' %}
  issuer: {{ q(issuer) }}
{% else %}
  issuer: "https://login.microsoftonline.com/{{ cfg.entra.tenantId|default('', true) }}/v2.0"
{% endif %}
  client:
    id: {{ q(cfg.entra.clientId|default('', true)) }}
{% if client_secret != '' %}
    secret: {{ q(client_secret) }}
{% endif %}
{% if scopes != '' %}
  scopes:
{% for scope in scopes.split(' ') if scope != '' %}
    - {{ q(scope) }}
{% endfor %}
{% endif %}
{% if groups != '' %}
  validate:
    groups:
{% for group in groups.split(',') if group != '' %}
      - {{ q(group) }}
{% endfor %}
{% endif %}
  refresh:
    enabled: true
    secret: {{ q(secret) }}

openvpn:
{% if cfg.daemon.passthroughEnabled|default('', true) == '1' %}
  addr: "unix:///var/etc/openvpn-auth-oauth2/server{{ vpnid.value }}.sock"
{% else %}
  addr: "unix:///var/etc/openvpn/server{{ vpnid.value }}.sock"
{% endif %}
  auth-token-user: true
  auth-pending-timeout: {{ cfg.validation.authTimeout|default('180', true) }}s
{% if cfg.daemon.passthroughEnabled|default('', true) == '1' %}
  pass-through:
    enabled: true
    address: "unix:///var/etc/openvpn/server{{ vpnid.value }}.sock"
{% endif %}

log:
  level: {{ cfg.daemon.logLevel|default('info', true) }}
{% endif %}
