{# lifecycle settings consumed by supervisor.py and status.py (key=value).
   Empty config.xml elements arrive as None, hence |default('', true). #}
{% if helpers.exists('OPNsense.OpenVPNAuthOAuth2.general.enabled') and OPNsense.OpenVPNAuthOAuth2.general.enabled == '1' %}
{% set cfg = OPNsense.OpenVPNAuthOAuth2 %}
{% set vpnid = namespace(value='') %}
{% set has_instances = helpers.exists('OPNsense.OpenVPN') and OPNsense.OpenVPN is mapping
       and helpers.exists('OPNsense.OpenVPN.Instances') and OPNsense.OpenVPN.Instances is mapping
       and helpers.exists('OPNsense.OpenVPN.Instances.Instance') %}
{% if has_instances %}
{%   for instance in helpers.toList('OPNsense.OpenVPN.Instances.Instance') %}
{%     if instance['@uuid'] == cfg.general.vpnInstance|default('', true) %}
{%       set vpnid.value = instance.vpnid %}
{%     endif %}
{%   endfor %}
{% endif %}
{# the management socket is named after the instance UUID (core: sockFilename
   = /var/etc/openvpn/instance-{uuid}.sock), not after the vpnid #}
{% set uuid = cfg.general.vpnInstance|default('', true) %}
enabled=1
vpnid={{ vpnid.value }}
instance_uuid={{ uuid }}
gui_socket=/var/etc/openvpn/instance-{{ uuid }}.sock
swapped_socket=/var/etc/openvpn-auth-oauth2/instance-{{ uuid }}.sock
passthrough={{ cfg.daemon.passthroughEnabled|default('0', true) }}
daemon_config=/usr/local/etc/openvpn-auth-oauth2/openvpn-auth-oauth2.yml
tls_enabled={{ cfg.http.tlsEnabled|default('0', true) }}
certificate_ref={{ cfg.http.certificate|default('', true) }}
listen_address={{ cfg.http.listenAddress|default('', true) }}
listen_port={{ cfg.http.listenPort|default('', true) }}
{% else %}
enabled=0
{% endif %}
