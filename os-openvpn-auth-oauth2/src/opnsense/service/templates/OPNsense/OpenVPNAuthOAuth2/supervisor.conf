{# lifecycle settings consumed by supervisor.py (key=value) #}
{% if helpers.exists('OPNsense.OpenVPNAuthOAuth2.general.enabled') and OPNsense.OpenVPNAuthOAuth2.general.enabled == '1' %}
{% set cfg = OPNsense.OpenVPNAuthOAuth2 %}
{% set vpnid = namespace(value='') %}
{% if helpers.exists('OPNsense.OpenVPN.Instances.Instance') %}
{%   for instance in helpers.toList('OPNsense.OpenVPN.Instances.Instance') %}
{%     if instance['@uuid'] == cfg.general.vpnInstance %}
{%       set vpnid.value = instance.vpnid %}
{%     endif %}
{%   endfor %}
{% endif %}
enabled=1
vpnid={{ vpnid.value }}
gui_socket=/var/etc/openvpn/server{{ vpnid.value }}.sock
swapped_socket=/var/run/openvpn-auth-oauth2/server{{ vpnid.value }}.sock
passthrough={{ cfg.daemon.passthroughEnabled }}
daemon_config=/usr/local/etc/openvpn-auth-oauth2/openvpn-auth-oauth2.yml
tls_enabled={{ cfg.http.tlsEnabled }}
certificate_ref={{ cfg.http.certificate }}
{% else %}
enabled=0
{% endif %}
