# SurfHost OPNsense plugin repository
#
# This is the source copy. tools/publish-repo.sh copies it to the gh-pages
# branch, which serves it at
# https://surfhost.github.io/opnsense-plugin-entra-sso/surfhost.conf
# Changes here reach users only after the next publish run, and only after
# each firewall re-fetches the file: pkg update refreshes the catalogue, not
# this configuration.
#
# Install on OPNsense:
#   fetch -o /usr/local/etc/pkg/repos/surfhost.conf \
#       https://surfhost.github.io/opnsense-plugin-entra-sso/surfhost.conf
#   pkg update
#
# Remove again:
#   rm /usr/local/etc/pkg/repos/surfhost.conf && pkg update

# priority 0 is the pkg default and the lowest value that is safe to write:
# pkg stores the priority in an unsigned int, so a negative number wraps to
# 4294967295 and would make this the most-preferred repository on the box.
# OPNsense's own repository is priority 11, so its packages win whenever both
# repositories offer the same name.
surfhost: {
  url: "https://surfhost.github.io/opnsense-plugin-entra-sso/${ABI}",
  priority: 0,
  enabled: yes
}
