# SurfHost OPNsense plugin repository
#
# Install on OPNsense:
#   fetch -o /usr/local/etc/pkg/repos/surfhost.conf \
#       https://surfhost.github.io/opnsense-plugin-entra-sso/surfhost.conf
#   pkg update
#
# Remove again:
#   rm /usr/local/etc/pkg/repos/surfhost.conf && pkg update

surfhost: {
  url: "https://surfhost.github.io/opnsense-plugin-entra-sso/${ABI}",
  priority: 5,
  enabled: yes
}
